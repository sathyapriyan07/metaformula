<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Detail</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="driver-detail">
  <header>
    <nav class="nav">
      <div class="logo">F1 ARCHIVE</div>
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/drivers.html">Drivers</a>
        <a href="/teams.html">Teams</a>
        <a href="/seasons.html">Seasons</a>
        <a href="/races.html">Races</a>
        <a href="/admin/index.html">Admin</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="detail-header">
      <img id="driver-image" alt="Driver" loading="lazy" />
      <div>
        <div class="badge" id="driver-nationality">—</div>
        <h1 id="driver-name">Driver</h1>
        <p class="label">Birthdate: <span id="driver-birthdate">—</span></p>
        <p class="label">Teams: <span id="driver-teams">—</span></p>
        <div class="meta-list" id="driver-stats"></div>
      </div>
    </section>

    <h2 class="section-title">Biography</h2>
    <div class="card" id="driver-bio"></div>
  </main>

  <footer class="footer">Curated driver profiles.</footer>
  <script src="/site.js"></script>
</body>
</html>
