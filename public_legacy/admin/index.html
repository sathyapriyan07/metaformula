<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Historical CMS</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="admin">
  <header>
    <nav class="nav">
      <div class="logo">F1 ARCHIVE CMS</div>
      <div class="nav-links">
        <a href="/index.html">Public Site</a>
        <a href="/admin/index.html">Dashboard</a>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-title">Dashboard</div>
      <button class="nav-item active" data-module="seasons">Seasons</button>
      <button class="nav-item" data-module="drivers">Drivers</button>
      <button class="nav-item" data-module="teams">Teams</button>
      <button class="nav-item" data-module="circuits">Circuits</button>
      <button class="nav-item" data-module="races">Races</button>
      <button class="nav-item" data-module="media">Media (URL)</button>
    </aside>

    <section class="admin-content">
      <div class="admin-header">
        <div>
          <div class="label">Admin Panel</div>
          <h1 id="module-title">Seasons</h1>
        </div>
        <button id="add-button" class="button">Add New</button>
      </div>

      <div id="table-container" class="card"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Edit</h2>
        <button id="modal-close" class="icon-button">×</button>
      </div>
      <form id="modal-form" class="modal-form"></form>
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="button secondary">Cancel</button>
        <button id="modal-save" type="submit" form="modal-form" class="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
